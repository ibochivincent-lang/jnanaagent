[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jnanaagent"
version = "0.1.0"
description = "Jnana Agent: Autonomous Codebase Reasoning, SWE-bench Bug Localization & Multi-Source Research Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IboTV", email = "vincent@ibotv.online" }]
dependencies = [
    "langgraph>=0.4",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2",
    "ddgs>=9",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "python-dotenv>=1.0",
    "neatlogs",
    "fastapi>=0.110",
    "uvicorn>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jnana = "research_agent.cli:main"
jnanaagent = "research_agent.cli:main"
jnanaterminal = "research_agent.server:main"
researchagent = "research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
