[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "A multi-step LangGraph research agent: topic in, cited markdown report out — with a human approval gate and a logged trace of every run."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Foundry AI" }]
dependencies = [
    "langgraph>=0.4",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2",
    "ddgs>=9",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "python-dotenv>=1.0",
    "neatlogs",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
